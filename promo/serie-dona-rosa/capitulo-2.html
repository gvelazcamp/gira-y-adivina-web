<script>

const CLAVE_ANTERIOR="TERMO";
const JUG=[["Don Tito","PASTA",["gris","gris","gris","gris","verde"]],["Nelly","TRIGO",["gris","amarilla","gris","gris","gris"]],["Pepito","MENTA",["gris","verde","gris","gris","verde"]]];   // pistas de YERBA
/* ================================================ */
document.querySelectorAll(".vent").forEach(v=>{const cols=["#d6403a","#F5B301","#2d7a8a","#7b4fa3","#3c9a5f"];for(let f=0;f<3;f++)for(let k=0;k<5;k++){const b=document.createElement("b");b.style.left=(14+k*38)+"px";b.style.top=(24+f*70)+"px";b.style.background=cols[(f+k)%5];v.appendChild(b);}});
{const it=document.getElementById("int"),cols=["#d6403a","#F5B301","#2d7a8a","#7b4fa3","#3c9a5f","#e58a2a"];for(const [y,h] of [[150,70],[300,80]])for(let k=0;k<15;k++){const b=document.createElement("b");b.className="prod";b.style.left=(80+k*62)+"px";b.style.top=(y-h)+"px";b.style.height=h+"px";b.style.background=cols[(k*7+y)%6];it.insertBefore(b,it.firstChild);}}
const ul=document.getElementById("lista");if(VOTARON.length>6)ul.classList.add("dos","mueve");else if(VOTARON.length>3)ul.classList.add("dos");VOTARON.forEach(n=>{const li=document.createElement("li");li.textContent=n;ul.appendChild(li);});
function fila(nombre){const d=document.createElement("div");d.className="fila";const n=document.createElement("div");n.className="n";n.textContent=nombre;d.appendChild(n);for(let i=0;i<5;i++){const c=document.createElement("div");c.className="c";d.appendChild(c);}return d;}

{const tA=document.getElementById("tabA");ANTES.forEach(([n,w,col])=>{const f=fila(n);[...f.querySelectorAll(".c")].forEach((c,i)=>{c.textContent=w[i];c.className="c "+col[i];});tA.appendChild(f);});tA.appendChild(fila("Doña Rosa"));tA.appendChild(fila(""));tA.appendChild(fila(""));}
const tabB=document.getElementById("tabB");JUG.forEach(j=>tabB.appendChild(fila(j[0])));for(let k=0;k<3;k++)tabB.appendChild(fila("¿Vos?"));
let T=0,SUBS=[],TIEMPOS={};
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>1-Math.pow(1-t,3),io=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function voltear(c,letra,col,tk,tv){c.textContent=T>=tk?letra:"";c.className="c"+(T>=tv+0.1?" "+col:"");const v=cl((T-tv)/0.2,0,1);c.style.transform=v>0&&v<1?"scaleY("+Math.abs(Math.cos(v*Math.PI))+")":(T>=tk&&T<tk+0.15?"scale(1.12)":"");}
function pintar(){
  const s=SUBS.find(x=>T>=x[0]&&T<x[1]);document.getElementById("sub").innerHTML=s?"<span>"+s[2]+"</span>":"";

  document.getElementById("hoja").style.transform="rotateY("+(-80*ease(cl((T-TIEMPOS.abre_p)/0.7,0,1)))+"deg)";
  document.getElementById("esc").style.transform="scale("+(1+0.12*ease(cl((T-TIEMPOS.abre_p)/1.6,0,1)))+")";document.getElementById("esc").style.transformOrigin="50% 62%";
  /* adentro: la libreta en la barra, con polvo */
  const inn=cl((T-TIEMPOS.adentro)/0.5,0,1);const it=document.getElementById("int");document.getElementById("intM").style.opacity=inn;
  it.style.transform="scale("+(1+0.35*io(cl((T-TIEMPOS.adentro-0.6)/(TIEMPOS.piz-TIEMPOS.adentro-0.6),0,1)))+")";it.style.transformOrigin="48% 58%";
  document.getElementById("rosaIn").style.transform="translateY("+(-Math.abs(Math.sin(T*3))*5)+"px)";

  const piz=document.getElementById("piz");let p=0;for(const [a,z] of [[TIEMPOS.piz,99]])if(T>=a&&T<z)p=Math.min(ease(cl((T-a)/0.5,0,1)),ease(cl((z-T)/0.4,0,1)));piz.style.opacity=p;piz.style.transform="scale("+(0.8+0.2*p)+")";
  const b=ease(cl((T-TIEMPOS.pagina)/0.6,0,1));document.getElementById("pA").style.opacity=1-b;document.getElementById("pB").style.opacity=b;
  
  /* T... E... R... M... O... (de a una, sin color) y después todo verde */
  [...document.querySelectorAll("#tabA .fila")[3].querySelectorAll(".c")].forEach((c,i)=>voltear(c,CLAVE_ANTERIOR[i],"verde",TIEMPOS.letras[i],TIEMPOS.verde+i*0.14));
