name: GiraYAdivinaTV
options:
  bundleIdPrefix: com.girayadivina
targets:
  GiraYAdivinaTV:
    type: application
    platform: tvOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources/cien.json
        buildPhase: resources
      - path: Resources/ahorcado.json
        buildPhase: resources
      - path: Resources/rosco.json
        buildPhase: resources
      - path: Resources/tutti.json
        buildPhase: resources
      - path: Resources/ruleta.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.girayadivina.tv
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.7
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "Girá y Adiviná"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
