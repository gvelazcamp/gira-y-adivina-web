<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160b24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Girá y Adiviná TV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icono-192.png">
<link rel="manifest" href="manifest-tv.json">
<title>Celular como TV · Girá y Adiviná</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#160B24}
#tvVirtual{position:absolute;left:0;top:0;width:1280px;height:720px;min-width:1280px;min-height:720px;border:0;display:block;transform-origin:0 0;background:#160B24}
#pantallaBtn{position:fixed;z-index:100;right:max(6px,env(safe-area-inset-right));top:max(6px,env(safe-area-inset-top));width:43px;height:43px;border:1px solid #F5B30188;border-radius:12px;background:#160B24DD;color:#F5B301;display:grid;place-items:center;font-size:25px;line-height:1;cursor:pointer;box-shadow:0 2px 8px #0008}
#pantallaBtn:focus-visible,#cerrarAyuda:focus-visible{outline:3px solid #37D6C0;outline-offset:2px}
html.modo-pantalla #pantallaBtn,html.instalada #pantallaBtn{display:none}
#rotar{display:none;position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99;width:max-content;max-width:90%;border:1px solid #F5B30188;border-radius:14px;background:#160B24E8;color:#F6EFE2;font:700 15px/1.35 system-ui,sans-serif;padding:12px 16px;text-align:center;pointer-events:none}
@media(orientation:portrait){#rotar{display:block}}
#ayuda{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:#0A0412CC}
#ayuda[hidden]{display:none}
#ayudaCaja{position:relative;width:min(420px,100%);max-height:90%;overflow:auto;border:1px solid #F5B30199;border-radius:20px;background:#241331;color:#F6EFE2;padding:28px 24px 22px;font:16px/1.5 system-ui,sans-serif;box-shadow:0 14px 36px #0009}
#ayudaCaja h2{font-size:21px;color:#F5B301;margin:0 30px 12px 0}
#ayudaCaja p{margin:0 0 10px}
#ayudaCaja ol{margin:8px 0;padding-left:24px}
#ayudaCaja li{margin:6px 0}
#cerrarAyuda{position:absolute;right:10px;top:10px;width:36px;height:36px;border:0;border-radius:9px;background:#3A2650;color:#fff;font-size:22px;cursor:pointer}

/* Controles del mismo iPhone: solo existen en la página celular-TV. */
#jugarTambien{position:fixed;z-index:110;left:max(9px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));max-width:65%;padding:11px 14px;border:1px solid #F5B301;border-radius:12px;background:#241331F2;color:#F5B301;font:900 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 3px 12px #0008}
#jugarTambien:disabled{opacity:.65;cursor:default}
#jugarTambien:focus-visible,#volverTV:focus-visible,#registro button:focus-visible,#registro input:focus-visible{outline:3px solid #37D6C0;outline-offset:2px}
#panelControles{position:fixed;inset:0;z-index:112;background:#160B24;transform:translateX(110%);pointer-events:none}
#panelControles.activo{transform:none;pointer-events:auto}
#controlJugador{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#160B24}
#volverTV{position:absolute;z-index:2;right:max(9px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));border:2px solid #F5B301;border-radius:12px;background:#241331;color:#F6EFE2;font:900 14px system-ui,sans-serif;padding:10px 14px;box-shadow:0 3px 12px #0009;cursor:pointer}
body.controles-abiertos #jugarTambien,body.controles-abiertos #pantallaBtn,body.controles-abiertos #rotar{display:none}
#registro{position:fixed;inset:0;z-index:210;display:grid;place-items:center;padding:18px;background:#0A0412E8}
#registro[hidden]{display:none}
#registroForm{width:min(380px,100%);border:1px solid #F5B30188;border-radius:18px;background:#241331;color:#F6EFE2;padding:24px;font:16px/1.4 system-ui,sans-serif}
#registroForm h2{margin:0 0 10px;color:#F5B301;font-size:23px}
#registroForm p{margin:0 0 15px}
#registroForm label{display:block;font-weight:800;margin-bottom:7px}
#nombreJugador{width:100%;padding:13px;border:1px solid #F5B301AA;border-radius:10px;background:#0C0616;color:white;font:700 18px system-ui,sans-serif}
#registroForm .acciones{display:flex;gap:10px;margin-top:15px}
#registroForm button{flex:1;border:0;border-radius:10px;padding:13px 8px;background:#F5B301;color:#160B24;font:900 14px system-ui,sans-serif;cursor:pointer}
#registroForm #cancelarRegistro{background:#3A2650;color:#F6EFE2}
#mensajeControl{position:fixed;z-index:220;left:50%;bottom:max(70px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:90%;padding:11px 16px;border:1px solid #F5B30188;border-radius:12px;background:#241331F2;color:#F6EFE2;font:800 14px/1.3 system-ui,sans-serif;text-align:center}
#mensajeControl[hidden]{display:none}
</style>
</head>
<body>
<iframe id="tvVirtual" width="1280" height="720" scrolling="no" title="Girá y Adiviná · Pantalla de TV" allow="autoplay; microphone; fullscreen; screen-wake-lock"></iframe>

<!-- La TV sigue cargada; el segundo iframe actúa como celular controlador. -->
<div id="panelControles" aria-label="Mis controles">
  <iframe id="controlJugador" title="Controles de jugador" allow="microphone; autoplay"></iframe>
  <button type="button" id="volverTV">📺 Ver TV</button>
</div>
<button type="button" id="jugarTambien">🎮 Yo también juego</button>
<div id="registro" hidden role="dialog" aria-modal="true" aria-labelledby="registroTitulo">
  <form id="registroForm">
    <h2 id="registroTitulo">Yo también juego</h2>
    <p>Tu iPhone sigue transmitiendo a la TV. Cuando abras los controles, también se verán en la tele.</p>
    <label for="nombreJugador">Tu nombre</label>
    <input id="nombreJugador" maxlength="14" required autocomplete="nickname" placeholder="¿Cómo te llamás?">
    <div class="acciones">
      <button type="submit">▶ Entrar</button>
      <button type="button" id="cancelarRegistro">Cancelar</button>
    </div>
  </form>
</div>
<div id="mensajeControl" role="status" hidden></div>
<button type="button" id="pantallaBtn" aria-label="Abrir pantalla completa" title="Pantalla completa">📺</button>
<div id="rotar" role="status">Girá el celular horizontalmente para ver la TV.</div>
<div id="ayuda" hidden role="dialog" aria-modal="true" aria-labelledby="ayudaTitulo">
  <div id="ayudaCaja">
    <button type="button" id="cerrarAyuda" aria-label="Cerrar">×</button>
    <h2 id="ayudaTitulo">Pantalla completa</h2>
    <div id="ayudaTexto"></div>
  </div>
</div>
<script>
/* Solo se abre cuando un celular hace de TV. Se conserva la presentación
   16:9 de la tele real, sin tocar el diseño de juegos ni los controles. */
(()=>{
  const marco=document.getElementById('tvVirtual');
  const destino=new URL('../index.html',location.href);
  destino.searchParams.set('tele','1');
  if(new URLSearchParams(location.search).get('telered')==='local')destino.searchParams.set('telered','local');
  marco.src=destino.href;
  const anchoTV=1280,altoTV=720;
  function ajustar(){
    const v=window.visualViewport;
    const ancho=v?.width||window.innerWidth;
    const alto=v?.height||window.innerHeight;
    if(ancho<=0||alto<=0)return;
    const escala=Math.min(ancho/anchoTV,alto/altoTV);
    const izq=(v?.offsetLeft||0)+(ancho-anchoTV*escala)/2;
    const arriba=(v?.offsetTop||0)+(alto-altoTV*escala)/2;
    marco.style.transform='translate('+izq+'px,'+arriba+'px) scale('+escala+')';
  }
  window.addEventListener('resize',ajustar);
  window.addEventListener('orientationchange',ajustar);
  window.addEventListener('pageshow',ajustar);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',ajustar);
    window.visualViewport.addEventListener('scroll',ajustar);
  }
  const ayuda=document.getElementById('ayuda');
  const texto=document.getElementById('ayudaTexto');
  const boton=document.getElementById('pantallaBtn');
  const ios=/iPhone|iPod/i.test(navigator.userAgent);
  const instalada=window.navigator.standalone===true||
    matchMedia('(display-mode: standalone)').matches||
    matchMedia('(display-mode: fullscreen)').matches;
  if(instalada)document.documentElement.classList.add('instalada');
  function mostrarAyuda(){
    texto.innerHTML=ios
      ?'<p>En iPhone, Safari no permite ocultar la barra ni forzar el giro desde un botón web.</p><ol><li>En Safari tocá <b>Compartir</b>.</li><li>Elegí <b>Agregar a pantalla de inicio</b>.</li><li>Abrí el ícono <b>Girá y Adiviná TV</b> desde tu inicio.</li><li>Giralo horizontalmente para jugar sin la barra de direcciones.</li></ol>'
      :'<p>El navegador no pudo abrir pantalla completa.</p><p>Probá desde Chrome en Android, o agregá <b>Girá y Adiviná TV</b> a la pantalla de inicio para abrirla sin la barra de direcciones.</p>';
    ayuda.hidden=false;
    document.getElementById('cerrarAyuda').focus();
  }
  function cerrarAyuda(){ayuda.hidden=true;boton.focus();}
  document.getElementById('cerrarAyuda').addEventListener('click',cerrarAyuda);
  ayuda.addEventListener('click',e=>{if(e.target===ayuda)cerrarAyuda();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ayuda.hidden)cerrarAyuda();});
  function actualizarPantalla(){
    const completa=!!(document.fullscreenElement||document.webkitFullscreenElement);
    document.documentElement.classList.toggle('modo-pantalla',completa);
    ajustar();
  }
  document.addEventListener('fullscreenchange',actualizarPantalla);
  document.addEventListener('webkitfullscreenchange',actualizarPantalla);
  boton.addEventListener('click',async()=>{
    if(ios){mostrarAyuda();return;}
    const raiz=document.documentElement;
    const solicitar=raiz.requestFullscreen||raiz.webkitRequestFullscreen;
    if(!solicitar){mostrarAyuda();return;}
    try{
      await solicitar.call(raiz,{navigationUI:'hide'});
      actualizarPantalla();
      try{if(screen.orientation&&typeof screen.orientation.lock==='function')await screen.orientation.lock('landscape');}catch(_){}
    }catch(_){mostrarAyuda();}
  });

  /* "Yo también juego": la pantalla de TV nunca se recarga ni se sustituye.
     Un segundo iframe se conecta como jugador a la MISMA sala; se deja
     montado al alternar entre ver la TV y utilizar los controles existentes. */
  const botonJugar=document.getElementById('jugarTambien');
  const panelControles=document.getElementById('panelControles');
  const controlJugador=document.getElementById('controlJugador');
  const volverTV=document.getElementById('volverTV');
  const registro=document.getElementById('registro');
  const formRegistro=document.getElementById('registroForm');
  const nombreJugador=document.getElementById('nombreJugador');
  const mensajeControl=document.getElementById('mensajeControl');
  let jugadorRegistrado=false,controlesAbiertos=false,ocultarMensaje=null;

  function avisoJugador(s){
    mensajeControl.textContent=s;
    mensajeControl.hidden=false;
    clearTimeout(ocultarMensaje);
    ocultarMensaje=setTimeout(()=>{mensajeControl.hidden=true;},3500);
  }
  function codigoTV(){
    /* No usar un código antiguo si la página de TV aún no arrancó. */
    try{
      const raiz=marco.contentDocument?.getElementById('teleTV');
      if(!raiz)return '';
      const visible=raiz.querySelector('.tl-codigo')?.textContent?.trim()||'';
      const codigo=visible||localStorage.getItem('gya_tele_codigo')||'';
      return /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{5}$/.test(codigo)?codigo:'';
    }catch(_){return '';}
  }
  function esTutti(){
    try{return !!marco.contentDocument?.querySelector('#teleTV.tl-juego-tutti');}
    catch(_){return false;}
  }
  function verTV(){
    controlesAbiertos=false;
    panelControles.classList.remove('activo');
    document.body.classList.remove('controles-abiertos');
    botonJugar.focus({preventScroll:true});
  }
  function verControles(){
    if(esTutti()){avisoJugador('En Tutti Frutti mirás la TV: tus respuestas aparecerían en pantalla.');return;}
    controlesAbiertos=true;
    panelControles.classList.add('activo');
    document.body.classList.add('controles-abiertos');
    volverTV.focus({preventScroll:true});
  }
  function iniciarJugador(nombre){
    const codigo=codigoTV();
    if(!codigo){avisoJugador('Esperá a que aparezca el código de sala en la TV.');return;}
    nombre=String(nombre||'').trim().slice(0,14);
    if(!nombre){registro.hidden=false;nombreJugador.focus();return;}
    try{localStorage.setItem('gya_tele_nombre',nombre);}catch(_){}
    const url=new URL('../index.html',location.href);
    url.searchParams.set('telecel',codigo);
    url.searchParams.set('n',nombre);
    url.searchParams.set('teleespejo','1');
    if(new URLSearchParams(location.search).get('telered')==='local')url.searchParams.set('telered','local');
    controlJugador.src=url.href;
    jugadorRegistrado=true;
    botonJugar.textContent='🎮 Mis controles';
    registro.hidden=true;
    verControles();
  }
  botonJugar.addEventListener('click',()=>{
    if(jugadorRegistrado){verControles();return;}
    if(esTutti()){avisoJugador('Tutti Frutti: este iPhone solo mira.');return;}
    let n='';
    try{n=(localStorage.getItem('gya_nombre')||localStorage.getItem('gya_tele_nombre')||'').trim().slice(0,14);}catch(_){}
    if(n)iniciarJugador(n);
    else{registro.hidden=false;nombreJugador.value='';nombreJugador.focus();}
  });
  volverTV.addEventListener('click',verTV);
  document.getElementById('cancelarRegistro').addEventListener('click',()=>{registro.hidden=true;botonJugar.focus();});
  formRegistro.addEventListener('submit',e=>{
    e.preventDefault();
    const nombre=nombreJugador.value.trim();
    if(nombre)iniciarJugador(nombre);
  });
  /* El anfitrión que duplica pantalla queda fuera de Tutti Frutti.
     Si se elige ese juego, volvemos a TV sin destruir el controlador. */
  setInterval(()=>{
    const tutti=esTutti();
    if(tutti&&controlesAbiertos)verTV();
    botonJugar.disabled=tutti;
    botonJugar.textContent=tutti?'📺 Tutti: solo mirar':jugadorRegistrado?'🎮 Mis controles':'🎮 Yo también juego';
  },900);
  ajustar();
})();
</script>
</body>
</html>
